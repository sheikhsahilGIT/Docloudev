<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workspace · CloudDev</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/workspace.css">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.js"></script>
</head>
<body>

<div class="ws-shell">

    <div class="ws-topbar">
        <a href="dashboard.html" class="ws-back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
            Dashboard
        </a>

        <span class="ws-project-name" id="wsProjectName">Loading…</span>
        <span class="ws-lang-tag" id="wsLangTag"></span>

        <div class="ws-status">
            <span class="ws-status-dot" id="wsStatusDot"></span>
            <span id="wsStatusText">checking…</span>
        </div>

        <span class="ws-resource-pill" id="wsResourcePill" style="display:none;"></span>

        <div class="ws-topbar-actions">
            <button class="ws-text-btn" id="wsStartBtn" style="display:none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                Start Container
            </button>
            <button class="ws-icon-btn" id="wsStopBtn" style="display:none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12"/></svg>
                Stop
            </button>
            <button class="ws-icon-btn" id="wsRestartBtn" style="display:none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                Restart
            </button>
            <span class="ws-save-hint">Ctrl+S to save</span>
            <button class="ws-text-btn primary" id="wsSaveBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
                Save
            </button>
        </div>
    </div>

    <div class="ws-main">

        <aside class="ws-filetree">
            <div class="ws-filetree-head">
                <span>Files</span>
                <div class="ws-filetree-head-actions">
                    <button id="wsNewFileBtn" title="New file">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><line x1="12" y1="12" x2="12" y2="18"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
                    </button>
                    <button id="wsNewFolderBtn" title="New folder">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
                    </button>
                    <button id="wsRefreshFiles" title="Refresh">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                    </button>
                </div>
            </div>
            <div class="ws-filetree-list" id="wsFileList"></div>
        </aside>

        <div class="ws-editor-col">
            <div class="ws-tab-bar" id="wsTabBar">
                <span class="dot"></span>
                <span id="wsOpenFileName">No file open</span>
                <span class="saved-flash" id="wsSavedFlash">Saved</span>
            </div>
            <div class="ws-editor-placeholder" id="wsEditorPlaceholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
                Select a file to start editing
            </div>
            <div id="monacoContainer" style="display:none;"></div>
        </div>

    </div>

    <div class="ws-terminal-panel">
        <div class="ws-terminal-head">
            <span class="term-status-dot" id="termStatusDot"></span>
            <span id="termStatusText">Terminal disconnected</span>
        </div>
        <div class="ws-terminal-stopped-overlay" id="wsTerminalStoppedOverlay">
            <span>Container is stopped.</span>
        </div>
        <div id="xtermContainer"></div>
    </div>

</div>

<script src="../js/api.js"></script>
<script src="../js/workspace.js"></script>
</body>
</html>
